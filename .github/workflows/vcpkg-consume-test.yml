name: vcpkg Registry Consumption Test

on:
  schedule:
    # Weekly Monday 6am UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  consume-test:
    name: Consume kcenon-common-system from registry
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout common_system
      uses: actions/checkout@v7

    - name: Setup vcpkg
      uses: kcenon/common_system/.github/actions/setup-vcpkg@main

    - name: Create test project with vcpkg manifest
      run: |
        mkdir -p /tmp/consume-test

        # vcpkg manifest that depends on kcenon-common-system from registry
        cat > /tmp/consume-test/vcpkg.json << 'MANIFEST'
        {
          "name": "consume-test",
          "version-string": "0.0.0",
          "dependencies": ["kcenon-common-system"]
        }
        MANIFEST

        # Registry configuration pointing to kcenon vcpkg-registry
        cat > /tmp/consume-test/vcpkg-configuration.json << 'REGISTRY'
        {
          "default-registry": {
            "kind": "builtin",
            "baseline": "d90a9b159c08169f39adcd1b0f1ac0ca12c4b96c"
          },
          "registries": [
            {
              "kind": "git",
              "repository": "https://github.com/kcenon/vcpkg-registry.git",
              "baseline": "1be52cbd3f11369cf9eb983c02c4404df3155cc3",
              "packages": ["kcenon-*"]
            }
          ]
        }
        REGISTRY

        cat > /tmp/consume-test/CMakeLists.txt << 'CMAKE'
        cmake_minimum_required(VERSION 3.20)
        project(consume_test LANGUAGES CXX)

        set(CMAKE_CXX_STANDARD 20)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)

        find_package(common_system CONFIG REQUIRED)

        add_executable(consume_test main.cpp)
        target_link_libraries(consume_test PRIVATE kcenon::common_system)
        CMAKE

        cat > /tmp/consume-test/main.cpp << 'CPPEOF'
        #include <kcenon/common/patterns/result.h>

        #include <iostream>

        int main()
        {
            std::cout << "vcpkg registry consumption test passed" << std::endl;
            return 0;
        }
        CPPEOF

    - name: Install dependencies via vcpkg
      run: |
        echo "Installing kcenon-common-system from vcpkg registry..."
        "${{ env.VCPKG_ROOT }}/vcpkg" install \
          --x-manifest-root=/tmp/consume-test \
          --x-install-root=/tmp/consume-test/vcpkg_installed 2>&1 || {
          echo "::error::Failed to install kcenon-common-system from vcpkg registry"
          exit 1
        }
        echo "kcenon-common-system installed successfully"

    - name: Configure test project
      run: |
        cmake -B /tmp/consume-test/build \
          -S /tmp/consume-test \
          -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}" \
          -DVCPKG_MANIFEST_DIR=/tmp/consume-test \
          -DVCPKG_INSTALLED_DIR=/tmp/consume-test/vcpkg_installed \
          -DCMAKE_BUILD_TYPE=Release 2>&1 || {
          echo "::error::CMake configure failed - find_package(common_system) may not work"
          exit 1
        }

    - name: Build test project
      run: |
        cmake --build /tmp/consume-test/build --config Release 2>&1 || {
          echo "::error::Build failed - linking against kcenon::common_system may be broken"
          exit 1
        }

    - name: Run test binary
      run: |
        /tmp/consume-test/build/consume_test || {
          echo "::error::Test binary failed to execute"
          exit 1
        }

  # Report once after all jobs, including matrices and summaries, finish.
  notify-scheduled-failure:
    name: Report scheduled failure
    needs:
      - consume-test
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: scheduled-failure-vcpkg-consume-test
      cancel-in-progress: false
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v9
        env:
          WORKFLOW_FILE: vcpkg-consume-test.yml
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            if (context.eventName !== 'schedule') return;
            const results = JSON.parse(process.env.NEEDS_JSON);
            if (!Object.values(results).some(job => job.result === 'failure')) return;

            const file = process.env.WORKFLOW_FILE;
            const marker = `<!-- scheduled-ci-failure:${file} -->`;
            const endMarker = `<!-- /scheduled-ci-failure:${file} -->`;
            const title = `[Scheduled CI] ${file} failed`;
            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}/attempts/${attempt}`;
            const report = [
              marker,
              '## Scheduled workflow failure',
              '',
              `**Workflow:** ${context.workflow} (\`.github/workflows/${file}\`)`,
              `**Schedule (UTC):** \`${context.payload.schedule}\``,
              `**Ref:** \`${context.ref}\``,
              `**Commit:** [\`${context.sha}\`](${repoUrl}/commit/${context.sha})`,
              `**Run:** [${context.runId}, attempt ${attempt}](${runUrl})`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              ...Object.entries(results).map(([job, value]) => `| \`${job}\` | ${value.result} |`),
              '',
              'Skipped downstream jobs are listed separately from failures.',
              'This block is updated automatically; keep investigation notes outside it.',
              endMarker
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });
            const matches = issues.filter(issue =>
              !issue.pull_request &&
              (issue.body || '').split('\n').some(line => line.trim() === marker)
            );
            const existing = matches.find(issue => issue.state === 'open') || matches[0];

            if (!existing) {
              const { data } = await github.rest.issues.create({
                ...context.repo, title, body: report
              });
              core.info(`Scheduled failure tracked in ${data.html_url}`);
            } else {
              const start = existing.body.indexOf(marker);
              const end = existing.body.indexOf(endMarker, start + marker.length);
              if (end === -1) {
                throw new Error(`Issue #${existing.number} has an incomplete report block; preserving its body.`);
              }
              const body = existing.body.slice(0, start) + report +
                existing.body.slice(end + endMarker.length);
              if (existing.state !== 'open' || existing.title !== title || existing.body !== body) {
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'open', title, body
                });
              }
              core.info(`Scheduled failure tracked in ${existing.html_url}`);
            }
