name: Port Sync Check
run-name: "coherence/${{ github.event.client_payload.correlation || github.run_id }}"
on:
  schedule:
    - cron: '0 7 * * 1'
  repository_dispatch:
    types: [coherence-change-v1]
  workflow_dispatch:
    inputs:
      lock_revision:
        description: Full common commit containing the accepted lock
        type: string
      bootstrap:
        description: Audit the explicit ci/ecosystem-candidate.json before a lock exists
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check-port-sync:
    name: Detect port drift between projects and vcpkg-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Resolve immutable source and registry revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/coherence_workflow.py prepare
      - name: Compare bytes, package/config paths, usage targets and versions
        id: raw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check_port_sync.py --snapshot coherence-input/snapshot.json --output port-sync.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Keep the existing scheduled/manual advisory policy. A dispatch
          # acknowledgement still requires raw zero via its result artifact.
          if [ "$code" -ne 0 ]; then
            echo "::warning::Port sync raw exit is $code; inspect port-sync.json"
          fi
      - name: Record dispatch result
        if: always() && steps.raw.outputs.code != ''
        env:
          RAW_CODE: ${{ steps.raw.outputs.code }}
        run: python3 scripts/coherence_workflow.py result --code "$RAW_CODE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coherence-result
          path: dispatch-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pinned-port-sync
          path: |
            port-sync.json
            coherence-input/

  # Report once after all jobs, including matrices and summaries, finish.
  notify-scheduled-failure:
    name: Report scheduled failure
    needs:
      - check-port-sync
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: scheduled-failure-port-sync-check
      cancel-in-progress: false
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v9
        env:
          WORKFLOW_FILE: port-sync-check.yml
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            if (context.eventName !== 'schedule') return;
            const results = JSON.parse(process.env.NEEDS_JSON);
            if (!Object.values(results).some(job => job.result === 'failure')) return;

            const file = process.env.WORKFLOW_FILE;
            const marker = `<!-- scheduled-ci-failure:${file} -->`;
            const endMarker = `<!-- /scheduled-ci-failure:${file} -->`;
            const title = `[Scheduled CI] ${file} failed`;
            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}/attempts/${attempt}`;
            const report = [
              marker,
              '## Scheduled workflow failure',
              '',
              `**Workflow:** ${context.workflow} (\`.github/workflows/${file}\`)`,
              `**Schedule (UTC):** \`${context.payload.schedule}\``,
              `**Ref:** \`${context.ref}\``,
              `**Commit:** [\`${context.sha}\`](${repoUrl}/commit/${context.sha})`,
              `**Run:** [${context.runId}, attempt ${attempt}](${runUrl})`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              ...Object.entries(results).map(([job, value]) => `| \`${job}\` | ${value.result} |`),
              '',
              'Skipped downstream jobs are listed separately from failures.',
              'This block is updated automatically; keep investigation notes outside it.',
              endMarker
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });
            const matches = issues.filter(issue =>
              !issue.pull_request &&
              (issue.body || '').split('\n').some(line => line.trim() === marker)
            );
            const existing = matches.find(issue => issue.state === 'open') || matches[0];

            if (!existing) {
              const { data } = await github.rest.issues.create({
                ...context.repo, title, body: report
              });
              core.info(`Scheduled failure tracked in ${data.html_url}`);
            } else {
              const start = existing.body.indexOf(marker);
              const end = existing.body.indexOf(endMarker, start + marker.length);
              if (end === -1) {
                throw new Error(`Issue #${existing.number} has an incomplete report block; preserving its body.`);
              }
              const body = existing.body.slice(0, start) + report +
                existing.body.slice(end + endMarker.length);
              if (existing.state !== 'open' || existing.title !== title || existing.body !== body) {
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'open', title, body
                });
              }
              core.info(`Scheduled failure tracked in ${existing.html_url}`);
            }
