name: SBOM Generation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  schedule:
    # Generate SBOM weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  security-events: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Generate SBOM with Syft (CycloneDX)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: cyclonedx-json
        output-file: sbom-cyclonedx.json
        artifact-name: sbom-cyclonedx

    - name: Generate SBOM with Syft (SPDX)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: spdx-json
        output-file: sbom-spdx.json
        artifact-name: sbom-spdx

    - name: Scan SBOM for CVEs with Grype
      uses: anchore/scan-action@v7
      id: grype-scan
      with:
        sbom: sbom-cyclonedx.json
        severity-cutoff: high
        fail-build: ${{ github.event_name == 'pull_request' }}
        output-format: sarif

    - name: Upload Grype SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always() && steps.grype-scan.outputs.sarif != ''
      continue-on-error: true
      with:
        sarif_file: ${{ steps.grype-scan.outputs.sarif }}

    - name: Parse vcpkg dependencies
      run: |
        if [ -f "vcpkg.json" ]; then
          python3 << 'PYEOF' > vcpkg-dependencies.md
        import json

        with open('vcpkg.json', 'r') as f:
            manifest = json.load(f)

        print("# vcpkg Dependencies")
        print()
        print(f"**Project**: {manifest.get('name', 'N/A')}")
        print(f"**Version**: {manifest.get('version', 'N/A')}")
        print()
        print("## Direct Dependencies")
        print()
        print("| Package | Version Constraint | Features |")
        print("|---------|-------------------|----------|")

        deps = manifest.get('dependencies', [])
        for dep in deps:
            if isinstance(dep, str):
                print(f"| {dep} | - | - |")
            elif isinstance(dep, dict):
                name = dep.get('name', 'unknown')
                version = dep.get('version>=', '-')
                features = ', '.join(dep.get('features', [])) or '-'
                print(f"| {name} | {version} | {features} |")

        features = manifest.get('features', {})
        if features:
            print()
            print("## Feature Dependencies")
            print()
            for feat_name, feat_data in features.items():
                feat_deps = feat_data.get('dependencies', [])
                if feat_deps:
                    print(f"### {feat_name}")
                    print()
                    print("| Package | Version Constraint | Features |")
                    print("|---------|-------------------|----------|")
                    for dep in feat_deps:
                        if isinstance(dep, str):
                            print(f"| {dep} | - | - |")
                        elif isinstance(dep, dict):
                            name = dep.get('name', 'unknown')
                            version = dep.get('version>=', '-')
                            dep_features = ', '.join(dep.get('features', [])) or '-'
                            print(f"| {name} | {version} | {dep_features} |")
                    print()
        PYEOF
        else
          echo "No vcpkg.json found" > vcpkg-dependencies.md
        fi

    - name: Create combined SBOM report
      run: |
        echo "# Software Bill of Materials (SBOM)" > SBOM_REPORT.md
        echo "" >> SBOM_REPORT.md
        echo "**Repository**: ${{ github.repository }}" >> SBOM_REPORT.md
        echo "**Branch**: ${{ github.ref_name }}" >> SBOM_REPORT.md
        echo "**Commit**: ${{ github.sha }}" >> SBOM_REPORT.md
        echo "**Generated**: $(date -u)" >> SBOM_REPORT.md
        echo "" >> SBOM_REPORT.md
        echo "## Available Formats" >> SBOM_REPORT.md
        echo "" >> SBOM_REPORT.md
        echo "- **CycloneDX**: sbom-cyclonedx.json" >> SBOM_REPORT.md
        echo "- **SPDX**: sbom-spdx.json" >> SBOM_REPORT.md
        echo "" >> SBOM_REPORT.md
        cat vcpkg-dependencies.md >> SBOM_REPORT.md

    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: sbom-${{ github.sha }}
        path: |
          sbom-cyclonedx.json
          sbom-spdx.json
          vcpkg-dependencies.md
          SBOM_REPORT.md
        retention-days: 90

    - name: Upload SBOM to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          sbom-cyclonedx.json
          sbom-spdx.json
          SBOM_REPORT.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Submit SBOM to Dependency Graph
      uses: advanced-security/spdx-dependency-submission-action@v0.4.0
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
      with:
        filePath: sbom-spdx.json

  # Report once after all jobs, including matrices and summaries, finish.
  notify-scheduled-failure:
    name: Report scheduled failure
    needs:
      - generate-sbom
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: scheduled-failure-sbom
      cancel-in-progress: false
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v9
        env:
          WORKFLOW_FILE: sbom.yml
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            if (context.eventName !== 'schedule') return;
            const results = JSON.parse(process.env.NEEDS_JSON);
            if (!Object.values(results).some(job => job.result === 'failure')) return;

            const file = process.env.WORKFLOW_FILE;
            const marker = `<!-- scheduled-ci-failure:${file} -->`;
            const endMarker = `<!-- /scheduled-ci-failure:${file} -->`;
            const title = `[Scheduled CI] ${file} failed`;
            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}/attempts/${attempt}`;
            const report = [
              marker,
              '## Scheduled workflow failure',
              '',
              `**Workflow:** ${context.workflow} (\`.github/workflows/${file}\`)`,
              `**Schedule (UTC):** \`${context.payload.schedule}\``,
              `**Ref:** \`${context.ref}\``,
              `**Commit:** [\`${context.sha}\`](${repoUrl}/commit/${context.sha})`,
              `**Run:** [${context.runId}, attempt ${attempt}](${runUrl})`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              ...Object.entries(results).map(([job, value]) => `| \`${job}\` | ${value.result} |`),
              '',
              'Skipped downstream jobs are listed separately from failures.',
              'This block is updated automatically; keep investigation notes outside it.',
              endMarker
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });
            const matches = issues.filter(issue =>
              !issue.pull_request &&
              (issue.body || '').split('\n').some(line => line.trim() === marker)
            );
            const existing = matches.find(issue => issue.state === 'open') || matches[0];

            if (!existing) {
              const { data } = await github.rest.issues.create({
                ...context.repo, title, body: report
              });
              core.info(`Scheduled failure tracked in ${data.html_url}`);
            } else {
              const start = existing.body.indexOf(marker);
              const end = existing.body.indexOf(endMarker, start + marker.length);
              if (end === -1) {
                throw new Error(`Issue #${existing.number} has an incomplete report block; preserving its body.`);
              }
              const body = existing.body.slice(0, start) + report +
                existing.body.slice(end + endMarker.length);
              if (existing.state !== 'open' || existing.title !== title || existing.body !== body) {
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'open', title, body
                });
              }
              core.info(`Scheduled failure tracked in ${existing.html_url}`);
            }
