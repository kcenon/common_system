name: Fuzzing

on:
  schedule:
    # Weekly run, Mondays at 05:17 UTC (off-peak to avoid the top-of-hour rush).
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      max_total_time:
        description: 'Seconds to run each fuzz target'
        required: false
        default: '300'

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [result_error_fuzzer]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Configure CMake
        run: |
          cmake -B build-fuzz -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_FUZZERS=ON \
            -DCOMMON_SYSTEM_BUILD_TESTS=OFF \
            -DCOMMON_SYSTEM_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-fuzz --target ${{ matrix.target }}

      - name: Run
        run: |
          ./build-fuzz/fuzz/${{ matrix.target }} \
            -max_total_time=${{ github.event.inputs.max_total_time || '300' }} \
            -print_final_stats=1 \
            fuzz/corpus/result_error

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-crashes
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
