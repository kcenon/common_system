name: Ecosystem Documentation Audit

on:
  schedule:
    - cron: '23 3 * * 1'  # Monday 3:23 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        repo:
          - common_system
          - thread_system
          - logger_system
          - container_system
          - monitoring_system
          - database_system
          - network_system
          - pacs_system

    steps:
      - name: Checkout audit tool
        uses: actions/checkout@v7
        with:
          path: common_system
          sparse-checkout: tools/doc-audit

      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          repository: kcenon/${{ matrix.repo }}
          path: ${{ matrix.repo }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Prepare audit tool
        run: |
          cp -r common_system/tools/doc-audit "$RUNNER_TEMP/doc_audit"

      - name: Run full audit
        run: |
          python -m doc_audit "$GITHUB_WORKSPACE/${{ matrix.repo }}" --format json \
            | tee audit-report.json
        env:
          PYTHONPATH: ${{ runner.temp }}

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-${{ matrix.repo }}
          path: audit-report.json
          retention-days: 30

  summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    needs: audit
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v8
        with:
          path: reports
          pattern: audit-*

      - name: Generate summary
        run: |
          echo "## Ecosystem Documentation Audit Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          for dir in reports/audit-*/; do
            repo=$(basename "$dir" | sed 's/^audit-//')
            if [ -f "$dir/audit-report.json" ]; then
              echo "| $repo | Completed |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $repo | No report |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # Report once after all jobs, including matrices and summaries, finish.
  notify-scheduled-failure:
    name: Report scheduled failure
    needs:
      - audit
      - summary
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: scheduled-failure-doc-audit-ecosystem
      cancel-in-progress: false
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v9
        env:
          WORKFLOW_FILE: doc-audit-ecosystem.yml
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            if (context.eventName !== 'schedule') return;
            const results = JSON.parse(process.env.NEEDS_JSON);
            if (!Object.values(results).some(job => job.result === 'failure')) return;

            const file = process.env.WORKFLOW_FILE;
            const marker = `<!-- scheduled-ci-failure:${file} -->`;
            const endMarker = `<!-- /scheduled-ci-failure:${file} -->`;
            const title = `[Scheduled CI] ${file} failed`;
            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}/attempts/${attempt}`;
            const report = [
              marker,
              '## Scheduled workflow failure',
              '',
              `**Workflow:** ${context.workflow} (\`.github/workflows/${file}\`)`,
              `**Schedule (UTC):** \`${context.payload.schedule}\``,
              `**Ref:** \`${context.ref}\``,
              `**Commit:** [\`${context.sha}\`](${repoUrl}/commit/${context.sha})`,
              `**Run:** [${context.runId}, attempt ${attempt}](${runUrl})`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              ...Object.entries(results).map(([job, value]) => `| \`${job}\` | ${value.result} |`),
              '',
              'Skipped downstream jobs are listed separately from failures.',
              'This block is updated automatically; keep investigation notes outside it.',
              endMarker
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });
            const matches = issues.filter(issue =>
              !issue.pull_request &&
              (issue.body || '').split('\n').some(line => line.trim() === marker)
            );
            const existing = matches.find(issue => issue.state === 'open') || matches[0];

            if (!existing) {
              const { data } = await github.rest.issues.create({
                ...context.repo, title, body: report
              });
              core.info(`Scheduled failure tracked in ${data.html_url}`);
            } else {
              const start = existing.body.indexOf(marker);
              const end = existing.body.indexOf(endMarker, start + marker.length);
              if (end === -1) {
                throw new Error(`Issue #${existing.number} has an incomplete report block; preserving its body.`);
              }
              const body = existing.body.slice(0, start) + report +
                existing.body.slice(end + endMarker.length);
              if (existing.state !== 'open' || existing.title !== title || existing.body !== body) {
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'open', title, body
                });
              }
              core.info(`Scheduled failure tracked in ${existing.html_url}`);
            }
