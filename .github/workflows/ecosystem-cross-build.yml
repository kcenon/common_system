name: Ecosystem Cross Build
run-name: "coherence/${{ github.event.client_payload.correlation || github.run_id }}"
on:
  push:
    branches: [main, develop, 'phase-*']
  pull_request:
    branches: [main, develop]
  repository_dispatch:
    types: [coherence-change-v1]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Validate the reviewed ci/ecosystem-candidate.json; never accept it automatically
        type: boolean
        default: false
      lock_revision:
        description: Full common commit containing the accepted lock (blank uses this workflow commit)
        type: string
      candidate_repository:
        description: One allowlisted repository to substitute (requires candidate_sha)
        type: string
      candidate_sha:
        description: Full candidate commit SHA
        type: string
permissions:
  contents: read
  actions: read # Verify the original build artifact when introducing the first lock.
concurrency:
  group: cross-build-${{ github.event.client_payload.correlation || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Pinned ecosystem configure, build and consumer checks
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-cross-build') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-13
      CXX: g++-13
      ECOSYSTEM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ECOSYSTEM_ORCHESTRATOR_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Resolve the exact candidate and lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/coherence_workflow.py prepare
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++-13 pkg-config libssl-dev libsqlite3-dev libicu-dev zlib1g-dev liblz4-dev libcurl4-openssl-dev
      - name: Build every repository and its installed consumer
        id: raw
        run: |
          set +e
          python3 scripts/ecosystem_build.py --snapshot coherence-input/snapshot.json --work-dir cross-build --jobs 2
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Record dispatch result
        if: always() && steps.raw.outputs.code != ''
        env:
          RAW_CODE: ${{ steps.raw.outputs.code }}
        run: python3 scripts/coherence_workflow.py result --code "$RAW_CODE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coherence-result
          path: dispatch-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ecosystem-evidence
          path: |
            cross-build/evidence.json
            coherence-input/snapshot.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ecosystem-logs
          path: |
            cross-build/*/*.log
            cross-build/*/build/compile_commands.json
            cross-build/*/build/dependency-provenance/
          retention-days: 30
  eligibility:
    name: Ecosystem lock eligibility
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require a completed build (including every raw tier)
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::No promotable snapshot: cross-build result is $BUILD_RESULT (skip-cross-build cannot promote)"
            exit 1
          fi
