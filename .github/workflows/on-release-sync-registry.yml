name: Sync Registry on Release

on:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    uses: kcenon/common_system/.github/workflows/sync-vcpkg-registry.yml@9edf2e5b91461353c296821e33fff1df4a2395e2
    with:
      port-name: kcenon-common-system
      version: ${{ github.event.release.tag_name }}
      coherence-tools-ref: 6f76d9b9480d0dffc9167dc4a2ca564cde708b4b
      tag-reality-mode: advisory
    secrets:
      REGISTRY_PAT: ${{ secrets.VCPKG_REGISTRY_PAT }}
