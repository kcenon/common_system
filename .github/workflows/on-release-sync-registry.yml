name: Sync Registry on Release

on:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    uses: kcenon/common_system/.github/workflows/sync-vcpkg-registry.yml@852fd616ebc9a67cd953f52c9a533da7f230c16e
    with:
      port-name: kcenon-common-system
      version: ${{ github.event.release.tag_name }}
      coherence-tools-ref: 6f76d9b9480d0dffc9167dc4a2ca564cde708b4b
      tag-reality-mode: advisory
    secrets:
      REGISTRY_PAT: ${{ secrets.VCPKG_REGISTRY_PAT }}
