# Codecov Configuration for common_system
# https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  # range lower bound (40) is the enforced gate floor (see project target below);
  # the upper bound (80) is the long-term aspiration from the gradual-improvement
  # plan, NOT the current measured/enforced value. The README quotes this same
  # floor + target so the advertised number stays consistent with this gate.
  range: "40...80"
  status:
    project:
      default:
        target: 40%
        threshold: 2%
        if_ci_failed: error
        informational: true  # Don't block PRs on coverage status
    patch:
      default:
        target: 60%
        threshold: 5%
        if_ci_failed: error
        informational: true  # Don't block PRs on coverage status

# Gradual improvement plan:
# - Phase 1 (Current): 40% project, 60% patch
# - Phase 2: 50% project, 70% patch
# - Phase 3: 60% project, 80% patch

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

ignore:
  - "tests/**/*"
  - "benchmarks/**/*"
  - "examples/**/*"
  - "integration_tests/**/*"
  - "sanitizers/**/*"
  - "docs/**/*"
  - "build/**/*"
  - "build_*/**/*"
  - "build-*/**/*"
  - "schemas/**/*"
  - "cmake/**/*"
  - "scripts/**/*"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: no
